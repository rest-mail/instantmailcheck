version: 2
project_name: instantmailcheck

before:
  hooks:
    - go mod tidy

builds:
  - id: instantmailcheck
    main: ./
    binary: instantmailcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'

release:
  github:
    owner: rest-mail
    name: instantmailcheck
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# Was `brews:` (a Homebrew *formula*), which goreleaser deprecated — Homebrew
# now wants pre-compiled binaries distributed as casks rather than formulae.
# The generated file therefore moves from Formula/ to Casks/ in the tap, and
# the install command becomes `brew install --cask`.
#
# `install:`/`test:` have no cask equivalent: a cask declares the binary and
# Homebrew links it, rather than running Ruby to do it.
homebrew_casks:
  - name: instantmailcheck
    repository:
      owner: antimatter-studios
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/rest-mail/instantmailcheck"
    # `brew audit` rejects a description over 80 characters, and the generated
    # file carries a DO-NOT-EDIT banner, so it can only be fixed here. The
    # previous wording was 89.
    description: "Mail server diagnostics — DNS, SMTP, IMAP, POP3, TLS, DKIM/SPF/DMARC, MTA-STS"
    license: "MIT"
    binaries:
      - instantmailcheck
    commit_author:
      name: rest-mail-bot
      email: noreply@rest-mail.com
