version: 2
project_name: instantmailcheck

before:
  hooks:
    - go mod tidy

builds:
  - id: instantmailcheck
    main: ./
    binary: instantmailcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'

release:
  github:
    owner: rest-mail
    name: instantmailcheck
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# Deliberately no Homebrew section here.
#
# This used to publish by writing straight into antimatter-studios/homebrew-tap
# with a token that had write access to it. That tap now reads each project's
# public releases, computes the checksum of the asset it actually downloaded, and
# has a person merge the result — so nothing automated can change what
# `brew install` fetches. See antimatter-studios/homebrew-tap#25.
#
# `Formula/instantmailcheck.rb` is therefore maintained in the tap, and picking a
# formula over a cask is the tap's call to make. It ships this as a formula: a
# cask would be quarantined by Homebrew, and since these binaries carry only the
# ad-hoc signature the linker applies, Gatekeeper would kill the first run unless
# the cask also cleared the attribute — and the call that clears it does not exist
# on Linux. Nothing quarantines what a formula installs.
#
# `goreleaser check` fails on the `brews:` section this replaced, because
# goreleaser deprecated its formula writer. That only ever constrained a pipeline
# that pushes the file, which this no longer does.
#
# The consequence for this repository: publishing a release is the whole job, and
# the release needs write access to nothing but itself.
