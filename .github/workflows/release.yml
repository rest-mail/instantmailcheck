name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # `~> v2` floats to the newest v2.x, and goreleaser removes deprecated
      # config in minor releases — so a release could break with no change here
      # and no warning. Bounding it to the 2.17 series still picks up patch
      # fixes, and moving to a new minor becomes a deliberate edit that CI
      # validates first.
      #
      # Not pinned to an exact patch: dependabot updates `uses:` refs but not an
      # action's `version` input, so an exact pin would silently go stale.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2.17'
          args: release --clean
        # No tap token: the release no longer writes into the Homebrew tap, so it
        # needs no credential for any repository but this one.
        #
        # The secret has since been deleted from this repository, and the tap's
        # CI rejects a formula or cask carrying a generator's DO-NOT-EDIT banner
        # — which is what a re-added publisher would write. So re-adding one here
        # fails its own release for want of a credential, and would be caught at
        # the tap even if it had one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
